<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Chromebooks</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#eef2f7;
  color:#172033;
}
.container{max-width:1050px;margin:0 auto;padding:35px 18px 60px}
header{text-align:center;margin-bottom:28px}
h1{margin:0 0 8px;font-size:32px}
header p{margin:0;color:#667085}
.search{
  background:white;border-radius:18px;padding:22px;
  box-shadow:0 8px 25px #00000012;margin-bottom:22px
}
.search-row{display:flex;gap:10px}
input{
  flex:1;padding:15px 17px;border:2px solid #d8dee9;
  border-radius:12px;font-size:17px;outline:none
}
input:focus{border-color:#4f7cff}
button{
  border:0;border-radius:12px;padding:0 24px;
  background:#4f7cff;color:white;font-size:16px;font-weight:bold;cursor:pointer
}
button:hover{filter:brightness(.95)}
#resultado{min-height:90px}
.card{
  background:white;border-radius:18px;padding:24px;
  box-shadow:0 8px 25px #00000012;
  border-left:7px solid #4f7cff;
}
.card h2{margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.info{
  background:#f7f8fb;border-radius:11px;padding:13px
}
.label{font-size:12px;color:#667085;text-transform:uppercase;font-weight:bold}
.value{font-size:17px;font-weight:bold;margin-top:4px;word-break:break-word}
.nao-encontrado{
  background:#fff4f4;border-left:7px solid #e5484d;
  padding:22px;border-radius:15px
}
.dica{margin-top:12px;color:#667085;font-size:14px}
@media(max-width:650px){
  .search-row{flex-direction:column}
  button{height:50px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>💻 Consulta de Chromebooks</h1>
  <p>Digite o patrimônio ou a identificação do Chromebook.</p>
</header>

<section class="search">
  <div class="search-row">
    <input id="busca" type="text" inputmode="numeric"
      placeholder="Ex.: 286600 ou 260422081211432" autocomplete="off">
    <button onclick="buscar()">🔎 BUSCAR</button>
  </div>
  <div class="dica">Você também pode pesquisar pelo número do Chromebook.</div>
</section>

<div id="resultado">
  <div class="card">
    <h2>🔎 Faça uma pesquisa</h2>
    <p>Digite um patrimônio ou identificação para localizar o equipamento.</p>
  </div>
</div>
</div>

const normalizar = valor =>
  String(valor ?? "").toLowerCase().replace(/[^a-z0-9]/g,"");

function buscar(){
  const texto = document.getElementById("busca").value.trim();
  const termo = normalizar(texto);
  const resultado = document.getElementById("resultado");

  if(!termo){
    resultado.innerHTML = `
      <div class="card">
        <h2>🔎 Faça uma pesquisa</h2>
        <p>Digite um patrimônio ou identificação para localizar o equipamento.</p>
      </div>`;
    return;
  }

  const encontrados = dados.filter(d =>
    normalizar(d[1]) === termo || normalizar(d[2]) === termo
  );

  if(encontrados.length === 0){
    resultado.innerHTML = `
      <div class="nao-encontrado">
        <h2>❌ Não encontrado</h2>
        <p>Nenhum Chromebook foi encontrado para <strong>${escapeHtml(texto)}</strong>.</p>
      </div>`;
    return;
  }

  resultado.innerHTML = encontrados.map(d => `
    <div class="card" style="margin-bottom:15px">
      <h2>💻 Chromebook nº ${escapeHtml(d[0])}</h2>
      <div class="grid">
        <div class="info"><div class="label">Identificação</div><div class="value">${escapeHtml(d[1])}</div></div>
        <div class="info"><div class="label">Patrimônio</div><div class="value">${escapeHtml(d[2])}</div></div>
        <div class="info"><div class="label">Grupo</div><div class="value">${escapeHtml(d[3])}</div></div>
        <div class="info"><div class="label">Etiqueta</div><div class="value">${escapeHtml(d[4])}</div></div>
        <div class="info"><div class="label">Local</div><div class="value">${escapeHtml(d[5])}</div></div>
      </div>
    </div>
  `).join("");
}

function escapeHtml(valor){
  return String(valor ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

document.getElementById("busca").addEventListener("keydown", e => {
  if(e.key === "Enter") buscar();
});
